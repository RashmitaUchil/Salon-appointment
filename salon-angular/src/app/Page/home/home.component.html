<div class="home-container">
  <div
    id="carouselExampleCaptions"
    class="carousel slide"
    data-bs-ride="carousel"
  >
    <div class="carousel-indicators">
      <button
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide-to="0"
        class="active"
        aria-current="true"
        aria-label="Slide 1"
      ></button>
      <button
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide-to="1"
        aria-label="Slide 2"
      ></button>
      <button
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide-to="2"
        aria-label="Slide 3"
      ></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img
          src="assets/img/salon1.jpg"
          class="carousel-image"
          alt="Salon 1"
          loading="lazy"
        />
        <div class="carousel-caption d-none d-md-block">
          <h3>Looking for a professional Beauty Salon?</h3>
        </div>
      </div>
      <div class="carousel-item">
        <img
          src="assets/img/salon2.jpg"
          class="carousel-image"
          alt="Salon 2"
          loading="lazy"
        />
        <div class="carousel-caption d-none d-md-block">
          <h3>Give yourself a makeover</h3>
        </div>
      </div>
      <div class="carousel-item">
        <img
          src="assets/img/salon3.jpg"
          class="carousel-image"
          alt="Salon 3"
          loading="lazy"
        />
        <div class="carousel-caption d-none d-md-block">
          <h3>Book your appointment now</h3>
          <a class="text-black" routerLink="/book"> click here to book </a>
        </div>
      </div>
    </div>
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#carouselExampleCaptions"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#carouselExampleCaptions"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
  <div class="container-xl con-service">
    <h2 class="section-title">Our Services</h2>

    <div class="services-container">
      <div
        [routerLink]="service.link"
        class="service-card"
        *ngFor="let service of services"
      >
        <img [src]="service.img" [alt]="service.name" />
        <div className="service-text">
          <h3>{{ service.name }}</h3>
          <p>{{ service.desc }}</p>
        </div>
      </div>
    </div>

    <button class="home-book-btn" (click)="navigateToBook()">
      Book Your Professional Appointment Now!
    </button>
  </div>
</div>

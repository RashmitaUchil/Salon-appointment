<div class="book">
  <h4 class="h4-head">Book Your Salon Appointment</h4>
  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
  <form bookForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label htmlFor="date">Date:</label>
      <input
        class="input-book"
        type="date"
        id="date"
        name="date"
        [(ngModel)]="bookObj.appointmentDate"
        required
        [min]="today"
        defaultValue="today"
        (input)="onInputChange()"
      />
    </div>
    <div class="form-group">
      <label htmlFor="time">Time:</label>
      <input
        class="input-book"
        type="time"
        id="appointmentTime"
        [(ngModel)]="bookObj.appointmentTime"
        name="time"
        (input)="onInputChange()"
      />
    </div>
    <div class="form-group">
      <label htmlFor="service">Service:</label>
      <select
        id="service"
        name="service"
        required
        (input)="onInputChange()"
        [(ngModel)]="bookObj.service"
      >
        <option value="">Select a service</option>
        <option value="haircut">Haircut</option>
        <option value="coloring">Hair Coloring</option>
        <option value="styling">Hair Styling</option>
        <option value="manicure">Manicure</option>
        <option value="pedicure">Pedicure</option>
      </select>
    </div>
    <div class="form-group">
      <label htmlFor="notes">Additional Notes:</label>
      <textarea
        id="notes"
        name="notes"
        [(ngModel)]="bookObj.additionalNotes"
        rows="3"
      ></textarea>
    </div>
    <button class="button-app" type="submit">
      {{ loading ? "Booking..." : "Book Appointment" }}
    </button>
  </form>
</div>

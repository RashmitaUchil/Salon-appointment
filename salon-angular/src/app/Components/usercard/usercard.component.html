<div class="text-center">
  <img
    src="/assets/img/user.jpg"
    class="user-img mb-3"
    width="100"
    height="100"
    alt="user.userName"
  />
  <h5 class="mb-3 text-pink-600">Hello {{ userName }}!</h5>

  <div class="d-grid gap-2">
    <button (click)="router.navigate(['profile'])" class="btn-opt">
      Profile
    </button>
    <button (click)="router.navigate(['app'])" class="btn-opt">
      Appointment History
    </button>

    <button (click)="handleAuth()" class="btn-out">Logout</button>
  </div>
</div>
